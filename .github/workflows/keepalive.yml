name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          for p in / /products; do
            curl -s -m 60 -o /dev/null -w "$p %{http_code}\n" https://caige-mall.onrender.com$p || true
          done
